name: pulse

on:
  schedule:
    - cron: "0 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/pulse.py, scripts/palette.py, .github/workflows/pulse.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity line
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pulse.py "${{ github.repository_owner }}" dist

      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update activity line"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" output
